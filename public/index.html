<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Smart Barangay System - Barangay Pianing</title>
    <link rel="icon" type="image/png" href="/assets/pianing-logo.png" />
    <meta name="description" content="Official Smart Barangay System for Barangay Pianing, Butuan City. Document requests, public health records, and resident management." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('smart_barangay_theme') || localStorage.getItem('theme');
          var isDark = saved === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>

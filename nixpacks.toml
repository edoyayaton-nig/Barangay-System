# Fallback Nixpacks configuration in case builder is switched
[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.mbstring', 'php82Extensions.fileinfo', 'php82Extensions.curl', 'php82Extensions.gd', 'nodejs_20']

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader --no-interaction',
  'npm install'
]

[phases.build]
cmds = [
  'npm run build'
]

[start]
cmd = 'node server/migrate.js && php artisan serve --host=0.0.0.0 --port=$PORT'
